# Full local/production stack: Postgres + Redis + web app + transcription worker.
#   docker compose up --build
# Set ASR keys + AUTH_SECRET in a .env file next to this one (compose auto-loads it).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: captions
      POSTGRES_PASSWORD: captions
      POSTGRES_DB: captions
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U captions"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  app:
    build: .
    restart: unless-stopped
    # Apply Postgres migrations (never accept-data-loss on real data), then start web.
    command: sh -c "node scripts/use-postgres.mjs && npx prisma migrate deploy && npm run start"
    environment:
      DATABASE_URL: postgresql://captions:captions@postgres:5432/captions
      QUEUE_DRIVER: bullmq
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      AUTH_ENABLED: "true"
      AUTH_SECRET: ${AUTH_SECRET:-please-change-this-secret}
      AUTH_DEV_LOGIN: ${AUTH_DEV_LOGIN:-true}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      STRICT_PROD_AUTH: ${STRICT_PROD_AUTH:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}
      RATE_LIMIT_UPLOAD_PER_MINUTE: ${RATE_LIMIT_UPLOAD_PER_MINUTE:-5}
      RATE_LIMIT_UPLOAD_PER_HOUR: ${RATE_LIMIT_UPLOAD_PER_HOUR:-30}
      ASR_PROVIDER: ${ASR_PROVIDER:-mock}
      ASR_LANGUAGE: ${ASR_LANGUAGE:-te}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # S3/R2 (only used when STORAGE_DRIVER=s3)
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - media:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    restart: unless-stopped
    command: npm run worker
    environment:
      DATABASE_URL: postgresql://captions:captions@postgres:5432/captions
      QUEUE_DRIVER: bullmq
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      EXPORT_WORKER_CONCURRENCY: ${EXPORT_WORKER_CONCURRENCY:-1}
      ASR_PROVIDER: ${ASR_PROVIDER:-mock}
      ASR_LANGUAGE: ${ASR_LANGUAGE:-te}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - media:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
  media:
