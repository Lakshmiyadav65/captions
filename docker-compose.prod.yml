# Production-oriented stack for Audience Magazine launch.
# Uses managed Neon Postgres (DATABASE_URL) + Redis + app + worker.
# Media must use R2/S3 (STORAGE_DRIVER=s3) — do not rely on the local volume for multi-host.
#
#   cp docs/env.production.example.md .env   # then fill secrets
#   docker compose -f docker-compose.prod.yml up --build -d
#
# Custom domain / HTTPS: terminate TLS at your host (Railway/Fly/Render/Caddy) → app:3000

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  app:
    build: .
    restart: unless-stopped
    command: sh -c "node scripts/use-postgres.mjs && npx prisma migrate deploy && npm run start"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      QUEUE_DRIVER: bullmq
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: s3
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      AUTH_ENABLED: "true"
      AUTH_DEV_LOGIN: "false"
      STRICT_PROD_AUTH: "true"
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      APP_URL: ${APP_URL}
      ASR_PROVIDER: ${ASR_PROVIDER:-sarvam}
      ASR_LANGUAGE: ${ASR_LANGUAGE:-te}
      OUTPUT_MODE: ${OUTPUT_MODE:-translit}
      SARVAM_API_KEY: ${SARVAM_API_KEY}
      SARVAM_MODE: ${SARVAM_MODE:-codemix}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TIMING_PROVIDER: ${TIMING_PROVIDER:-openai}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      MAX_VIDEO_MINUTES: ${MAX_VIDEO_MINUTES:-5}
      QUOTA_MONTHLY_MINUTES: ${QUOTA_MONTHLY_MINUTES:-90}
      QUOTA_MAX_ACTIVE_JOBS: ${QUOTA_MAX_ACTIVE_JOBS:-2}
      RATE_LIMIT_UPLOAD_PER_MINUTE: ${RATE_LIMIT_UPLOAD_PER_MINUTE:-3}
      RATE_LIMIT_UPLOAD_PER_HOUR: ${RATE_LIMIT_UPLOAD_PER_HOUR:-15}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      - redis

  worker:
    build: .
    restart: unless-stopped
    command: npm run worker
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      QUEUE_DRIVER: bullmq
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: s3
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      EXPORT_WORKER_CONCURRENCY: ${EXPORT_WORKER_CONCURRENCY:-1}
      ASR_PROVIDER: ${ASR_PROVIDER:-sarvam}
      ASR_LANGUAGE: ${ASR_LANGUAGE:-te}
      OUTPUT_MODE: ${OUTPUT_MODE:-translit}
      SARVAM_API_KEY: ${SARVAM_API_KEY}
      SARVAM_MODE: ${SARVAM_MODE:-codemix}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TIMING_PROVIDER: ${TIMING_PROVIDER:-openai}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      MAX_VIDEO_MINUTES: ${MAX_VIDEO_MINUTES:-5}
    depends_on:
      - redis

volumes:
  redisdata:
